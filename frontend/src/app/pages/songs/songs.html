
<h1>
  All Songs
</h1>

<div class="AddSong">
  <p>+</p>
</div>

<div class="SongContainer">
  @for (song of songs; track song.id) {
    <div class="Card">
      <button class="X" (click)="deleteSong(song.id)">X</button>
      <h3>{{ song.title }}</h3>
      <p>{{ song.artist }}</p>

      @if (song.hasAcoustic) {
        <a>acoustic</a>
      }

      @if (song.hasElectric) {
        <a>electric</a>
      }
    </div>
  }
</div>
